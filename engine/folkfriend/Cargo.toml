[package]
name = "folkfriend"
version = "1.3.0"
authors = ["Tom Wyllie <tom@wyllie.dev>"]
edition = "2018"
description = "Transcription and recognition of traditional instrumental folk music (engine modules only)"
repository = "https://github.com/TomWyllie/folkfriend"
license = "GPL-3.0-only"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
aho-corasick = "0.7.18"
fnv = "1.0.7"
rustfft = "6.0.1"
serde = { version = "1.0.126", features = ["derive"] }
serde_json = "1.0"
