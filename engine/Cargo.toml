[package]
name = "tune-finder-engine"
version = "0.1.0"
edition = "2021"
description = "WebAssembly wrapper around the FolkFriend transcription and search engine"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
folkfriend = { path = "folkfriend" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
